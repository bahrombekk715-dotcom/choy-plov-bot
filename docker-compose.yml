services:
  db:
    image: postgres:16-alpine
    container_name: choy-plov-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-choyplov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD ni belgilang}
      POSTGRES_DB: ${POSTGRES_DB:-choyplov}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: choy-plov-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # yuklangan rasmlar (data/uploads) va eski bot.db (ko'chirish uchun)
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-choyplov}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-choyplov}

volumes:
  pgdata:
