<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#060a13">
    <title>Choy Plov</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand"><span class="tile blue big"><svg class="ic lg"><use href="/static/img/icons.svg#i-plov"/></svg></span>
                <div><b>Choy Plov</b><small data-i18n="w_tagline">Mazali milliy taomlar</small></div></div>
            <button class="tile-btn" id="lang-btn" aria-label="Language"><svg class="ic"><use href="/static/img/icons.svg#i-globe"/></svg><span id="lang-code">UZ</span></button>
        </header>
        <main id="view"></main>
    </div>

    <div class="tabbar">
        <nav id="tabs">
            <button data-tab="menu" class="active"><svg class="ic"><use href="/static/img/icons.svg#i-menu"/></svg><span data-i18n="w_menu">Menyu</span></button>
            <button data-tab="favorites"><svg class="ic"><use href="/static/img/icons.svg#i-heart"/></svg><span data-i18n="w_favorites">Sevimlilar</span></button>
            <button class="cart-tab" id="cart-tab" aria-label="Cart"><span class="ring"><svg class="ic lg"><use href="/static/img/icons.svg#i-cart"/></svg><b id="cart-count" class="hidden">0</b></span><span data-i18n="w_cart">Savat</span></button>
            <button data-tab="orders"><svg class="ic"><use href="/static/img/icons.svg#i-orders"/></svg><span data-i18n="w_orders">Buyurtmalar</span></button>
            <button data-tab="profile"><svg class="ic"><use href="/static/img/icons.svg#i-user"/></svg><span data-i18n="w_profile">Profil</span></button>
        </nav>
    </div>

    <div id="sheet-root"></div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
