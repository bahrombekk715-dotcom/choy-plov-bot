<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <title>Choy Plov</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <div class="logo-icon">🍲</div>
            <span>Choy Plov</span>
        </div>
        <button class="cart-btn" onclick="showCart()">
            🛒 <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <!-- Asosiy sahifalar -->
    <main id="main-content">
        <section id="page-menu" class="page active">
            <div class="categories-bar" id="categories"></div>
            <div class="products-grid" id="products"></div>
        </section>

        <section id="page-orders" class="page">
            <h2 class="page-title">📋 Buyurtmalar</h2>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterOrders('all', this)">Barchasi</button>
                <button class="filter-tab" onclick="filterOrders('pending', this)">Kutilmoqda</button>
                <button class="filter-tab" onclick="filterOrders('completed', this)">Tasdiqlangan</button>
                <button class="filter-tab" onclick="filterOrders('cancelled', this)">Bekor</button>
            </div>
            <div id="orders-list" class="orders-list"></div>
        </section>

        <section id="page-profile" class="page">
            <h2 class="page-title">👤 Profil</h2>
            <div id="profile-content"></div>
        </section>
    </main>

    <!-- Pastki navigatsiya -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('menu', this)">
            <span>🍽</span><small>Menyu</small>
        </button>
        <button class="nav-btn" onclick="switchTab('orders', this)">
            <span>📋</span><small>Buyurtmalar</small>
        </button>
        <button class="nav-btn" onclick="switchTab('profile', this)">
            <span>👤</span><small>Profil</small>
        </button>
    </nav>

    <!-- Savat modali -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛒 Savat</h3>
                <button class="close-btn" onclick="hideCart()">✕</button>
            </div>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Jami:</span>
                    <strong id="cart-total">0 so'm</strong>
                </div>
                <button class="btn-primary" onclick="openCheckout()">Buyurtma berish</button>
            </div>
        </div>
    </div>

    <!-- Checkout modali -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Buyurtmani rasmiylashtirish</h3>
                <button class="close-btn" onclick="closeCheckout()">✕</button>
            </div>
            <div class="form-group">
                <label>📞 Telefon raqam</label>
                <input type="tel" id="input-phone" placeholder="+998901234567">
            </div>
            <div class="form-group">
                <label>📍 Manzil</label>
                <input type="text" id="input-address" placeholder="Toshkent, Chilonzor">
            </div>
            <div class="form-group">
                <label>💬 Izoh (ixtiyoriy)</label>
                <textarea id="input-comment" placeholder="Qo'shimcha ma'lumot..."></textarea>
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Jami:</span>
                    <strong id="checkout-total">0 so'm</strong>
                </div>
                <button class="btn-primary" onclick="submitOrder()">✓ Buyurtmani tasdiqlash</button>
            </div>
        </div>
    </div>

    <!-- Mahsulot detali -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-btn floating" onclick="closeProductModal()">✕</button>
            <div id="product-detail"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Bizning SDK -->
    <script src="/static/js/sdk.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
