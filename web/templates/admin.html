<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#060a13">
    <title>Choy Plov — Admin</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="login" class="login hidden"></div>

    <div id="shell" class="shell hidden">
        <aside class="side">
            <div class="logo"><img class="logo-img sm" src="/static/img/logo.svg" alt="" width="38" height="38">Choy <i>Plov</i> <span class="tag">Admin</span></div>
            <nav id="nav">
                <button data-page="dashboard" class="active"><svg class="ic"><use href="/static/img/icons.svg#i-chart"/></svg><span>Dashboard</span></button>
                <button data-page="orders"><svg class="ic"><use href="/static/img/icons.svg#i-orders"/></svg><span>Buyurtmalar</span><i class="badge-dot hidden" id="pending-dot"></i></button>
                <button data-page="products"><svg class="ic"><use href="/static/img/icons.svg#i-box"/></svg><span>Mahsulotlar</span></button>
                <button data-page="addons"><svg class="ic"><use href="/static/img/icons.svg#i-plus"/></svg><span>Qo'shimchalar</span></button>
            <button data-page="users"><svg class="ic"><use href="/static/img/icons.svg#i-users"/></svg><span>Foydalanuvchilar</span></button>
            </nav>
            <a class="side-link" href="/"><svg class="ic"><use href="/static/img/icons.svg#i-menu"/></svg><span>Saytga qaytish</span></a>
            <button class="side-link hidden" id="logout"><svg class="ic"><use href="/static/img/icons.svg#i-logout"/></svg><span>Chiqish</span></button>
        </aside>
        <main class="main" id="main"></main>
    </div>

    <div id="sheet-root"></div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
